which\n * inspects `isAxiosError`, `config.method`, and `response.status`. Mirrors\n * the construction pattern used in `should-retry.spec.ts` so the suite is\n * consistent.\n */\nfunction makeAxiosError(method: string, status?: number): AxiosError {\n  const error = new Error('test') as Error & {\n    isAxiosError: boolean\n    response?: { status: number }\n    request?: object\n    config?: { method: string }\n  }\n  error.isAxiosError = true\n  error.config = { method }\n  if (status !== undefined) {\n    error.response = { status }\n  }\n  else {\n    error.request = {}\n  }\n  return error as unknown as AxiosError\n}\n\ndescribe('resilience policy presets', () => {\n  describe('ResilencePresets enum', () => {\n    it('has the documented string values', () => {\n      // String values are part of the public contract — README and consumer\n      // code references them directly via `resiliencePolicyPresets[Enum.X]`.\n      expect(ResilencePresets.CONSERVATIVE).toBe('conservative')\n      expect(ResilencePresets.RESTFULL).toBe('restfull')\n      expect(ResilencePresets.LOW_QUALITY).toBe('low-quality')\n    })\n\n    it('exposes exactly three presets', () => {\n      // Adding a new preset is a public-surface change that requires the\n      // README's \"Configuration Strategies\" section to be updated.\n      const keys = Object.keys(ResilencePresets).filter((k) => Number.isNaN(Number(k)))\n      expect(keys).toHaveLength(3)\n    })\n  })\n\n  describe('safeMethodsRetry', () => {\n    it('configures maxAttempts=3', () => {\n      expect(safeMethodsRetry.maxAttempts).toBe(3)\n    })\n\n    it('retries safe HTTP methods (GET/HEAD/OPTIONS) on 5xx', () => {\n      // Pin the documented \"GET/HEAD/OPTIONS only\" behaviour. Adding new\n      // methods to the safe list requires updating the README + this test.\n      expect(safeMethodsRetry.shouldRetry?.(makeAxiosError('GET', 500))).toBe(true)\n      expect(safeMethodsRetry.shouldRetry?.(makeAxiosError('HEAD', 503))).toBe(true)\n      expect(safeMethodsRetry.shouldRetry?.(makeAxiosError('OPTIONS', 502))).toBe(true)\n    })\n\n    it('does NOT retry non-safe methods (POST/PUT/DELETE/PATCH) on 5xx', () => {\n      // Non-idempotent methods MUST NOT be retried under the conservative\n      // safe-list. Mutation testing previously caught a regression where the\n      // method allow-list was widened by accident.\n      expect(safeMethodsRetry.shouldRetry?.(makeAxiosError('POST', 500))).toBe(false)\n      expect(safeMethodsRetry.shouldRetry?.(makeAxiosError('PUT', 500))).toBe(false)\n      expect(safeMethodsRetry.shouldRetry?.(makeAxiosError('DELETE', 500))).toBe(false)\n      expect(safeMethodsRetry.shouldRetry?.(makeAxiosError('PATCH', 500))).toBe(false)\n    })\n  })\n\n  describe('defaultCircutBreaker', () => {\n    it('configures the half-open recovery window at 60 seconds', () => {\n      expect(defaultCircutBreaker.halfOpenAfter).toBe(60_000)\n    })\n\n    it('uses a sampling-options breaker spec (threshold near 1, 60s duration, 100 minRps)', () => {\n      // SamplingBreaker requires `0 <"+" threshold <"+" 1` strictly — `0.99` is the\n      // pinned value. Reverting to `1` resurrects the historical RangeError.\n      const breaker = defaultCircutBreaker.breaker as {\n        threshold: number\n        duration: number\n        minimumRps: number\n      }\n      expect(breaker.threshold).toBeGreaterThan(0)\n      expect(breaker.threshold).toBeLessThan(1)\n      expect(breaker.threshold).toBe(0.99)\n      expect(breaker.duration).toBe(60_000)\n      expect(breaker.minimumRps).toBe(100)\n    })\n  })\n\n  describe('resiliencePolicyPresets[CONSERVATIVE]', () => {\n    const preset = resiliencePolicyPresets[ResilencePresets.CONSERVATIVE]\n\n    it('shares the safeMethodsRetry retry config object', () => {\n      // Identity equality matters — same object reference is the intent so\n      // future tweaks to `safeMethodsRetry` propagate through the preset.\n      expect(preset.retry).toBe(safeMethodsRetry)\n    })\n\n    it('shares the defaultCircutBreaker circuit-breaker config object', () => {\n      expect(preset.circuitBreaker).toBe(defaultCircutBreaker)\n    })\n\n    it('does not configure bulkhead or fallback', () => {\n      // README documents \"retry + circuitBreaker only\" for CONSERVATIVE.\n      // Adding bulkhead/fallback is a NFR change requiring docs update.\n      expect(preset.bulkhead).toBeUndefined()\n      expect(preset.fallback).toBeUndefined()\n    })\n  })\n\n  describe('resiliencePolicyPresets[RESTFULL]', () => {\n    const preset = resiliencePolicyPresets[ResilencePresets.RESTFULL]\n\n    it('preserves maxAttempts=3 from safeMethodsRetry', () => {\n      expect(preset.retry?.maxAttempts).toBe(3)\n    })\n\n    it('shares the same backoff factory as safeMethodsRetry (spread copy)', () => {\n      // RESTFULL retry config spreads `safeMethodsRetry`, so sub-fields\n      // (other than `shouldRetry`) must be reference-equal to the source.\n      expect(preset.retry?.backoff).toBe(safeMethodsRetry.backoff)\n    })\n\n    it('uses a DIFFERENT shouldRetry function than safeMethodsRetry', () => {\n      // The whole point of the RESTFULL preset is a wider method allow-list,\n      // implemented by overriding `shouldRetry`. Identity inequality is the\n      // simplest way to verify the override actually replaced the function.\n      expect(preset.retry?.shouldRetry).not.toBe(safeMethodsRetry.shouldRetry)\n    })\n\n    it('retries safe HTTP methods (GET/HEAD/OPTIONS) on 5xx', () => {\n      // RESTFULL is a superset — it MUST still retry GET/HEAD/OPTIONS.\n      expect(preset.retry?.shouldRetry?.(makeAxiosError('GET', 500))).toBe(true)\n      expect(preset.retry?.shouldRetry?.(makeAxiosError('HEAD', 503))).toBe(true)\n      expect(preset.retry?.shouldRetry?.(makeAxiosError('OPTIONS', 502))).toBe(true)\n    })\n\n    it('retries PUT and DELETE on 5xx (extended idempotent set)', () => {\n      // The README's \"Restfull\" section documents PUT/DELETE retries. This\n      // test exercises the actual `shouldRetry` arrow function in the\n      // preset (which `LOW_QUALITY` and `CONSERVATIVE` do not).\n      expect(preset.retry?.shouldRetry?.(makeAxiosError('PUT', 500))).toBe(true)\n      expect(preset.retry?.shouldRetry?.(makeAxiosError('DELETE', 503))).toBe(true)\n    })\n\n    it('does NOT retry POST or PATCH on 5xx (still excluded)', () => {\n      // PATCH and POST remain non-idempotent under REST semantics, so the\n      // preset MUST NOT retry them even though it widens PUT/DELETE.\n      expect(preset.retry?.shouldRetry?.(makeAxiosError('POST', 500))).toBe(false)\n      expect(preset.retry?.shouldRetry?.(makeAxiosError('PATCH', 500))).toBe(false)\n    })\n\n    it('also handles network errors for PUT/DELETE (no response)', () => {\n      // Without a response, the error is treated as a network/internal error.\n      // PUT/DELETE remain in the allow-list, so retry must fire.\n      const putNetwork = makeAxiosError('PUT')\n      // axios sets `code` for true network errors; supply one so\n      // `isNetworkError` returns true.\n      ;(putNetwork as AxiosError & { code: string }).code = 'ECONNRESET'\n      expect(preset.retry?.shouldRetry?.(putNetwork)).toBe(true)\n    })\n\n    it('shares the defaultCircutBreaker circuit-breaker config object', () => {\n      expect(preset.circuitBreaker).toBe(defaultCircutBreaker)\n    })\n  })\n\n  describe('resiliencePolicyPresets[LOW_QUALITY]', () => {\n    const preset = resiliencePolicyPresets[ResilencePresets.LOW_QUALITY]\n\n    it('reuses the same safeMethodsRetry config as CONSERVATIVE', () => {\n      // README documents LOW_QUALITY as \"same retry surface as CONSERVATIVE\"\n      // — naming-only differentiator. Identity equality enforces that.\n      expect(preset.retry).toBe(safeMethodsRetry)\n    })\n\n    it('reuses the same defaultCircutBreaker as CONSERVATIVE', () => {\n      expect(preset.circuitBreaker).toBe(defaultCircutBreaker)\n    })\n  })\n\n  describe('resiliencePolicyPresets table shape', () => {\n    it('has an entry for every ResilencePresets enum value', () => {\n      // Drift between enum members and lookup keys would cause silent\n      // `undefined` lookups at consumer call sites.\n      for (const preset of Object.values(ResilencePresets)) {\n        expect(resiliencePolicyPresets[preset]).toBeDefined()\n        expect(resiliencePolicyPresets[preset].retry).toBeDefined()\n        expect(resiliencePolicyPresets[preset].circuitBreaker).toBeDefined()\n      }\n    })\n  })\n})\n"},"src/client/__tests__/execute-with-policy.decorator.spec.ts":{"tests":[{"id":"228","name":"ExecuteWithPolicy decorator policy execution should invoke policy.execute exactly once per call","location":{"start":{"column":6,"line":29}}},{"id":"229","name":"ExecuteWithPolicy decorator policy execution should call original method inside executor with original args and unwrap Observable via firstValueFrom","location":{"start":{"column":6,"line":50}}},{"id":"230","name":"ExecuteWithPolicy decorator policy execution should read `policy` lazily from the instance at call time, not at decoration time","location":{"start":{"column":6,"line":73}}},{"id":"231","name":"ExecuteWithPolicy decorator signal forwarding for `request` propertyKey should inject `policyCtx.signal` into args[0] for `request` method","location":{"start":{"column":6,"line":101}}},{"id":"232","name":"ExecuteWithPolicy decorator signal forwarding for `request` propertyKey should default to an empty config when args[0] is undefined for `request`","location":{"start":{"column":6,"line":125}}},{"id":"233","name":"ExecuteWithPolicy decorator non-observable return values awaits a Promise return value when the wrapped method does not return an Observable","location":{"start":{"column":6,"line":150}}},{"id":"234","name":"ExecuteWithPolicy decorator non-observable return values awaits a synchronous (non-Promise, non-Observable) return value","location":{"start":{"column":6,"line":171}}},{"id":"235","name":"ExecuteWithPolicy decorator signal NOT forwarded for non-`request` methods should NOT inject signal into args for `get`","location":{"start":{"column":6,"line":192}}},{"id":"236","name":"ExecuteWithPolicy decorator signal NOT forwarded for non-`request` methods should NOT inject signal into args for `post`","location":{"start":{"column":6,"line":215}}}],"source":"import { of } from 'rxjs'\nimport type { IDefaultPolicyContext, IPolicy } from 'cockatiel'\nimport type { AxiosResponse } from 'axios'\n\nimport { ExecuteWithPolicy } from '../execute-with-policy.decorator'\n\n/**\n * Constructor-injected stub policy that immediately invokes the executor with a\n * deterministic policy context (carrying a sentinel `AbortSignal`) and returns\n * its awaited result. Avoids any `jest.mock` of cockatiel/axios/@nestjs/axios,\n * keeping the test isolated to decorator semantics.\n */\nfunction buildStubPolicy(signal: AbortSignal): IPolicy<"+"IDefaultPolicyContext, unknown> & {\n  execute: jest.Mock\n} {\n  const execute = jest.fn(\n    async (fn: (ctx: IDefaultPolicyContext) => unknown | PromiseLike<"+"unknown>) => fn({ signal }),\n  )\n\n  return {\n    execute,\n    onSuccess: jest.fn(),\n    onFailure: jest.fn(),\n  } as unknown as IPolicy<"+"IDefaultPolicyContext, unknown> & { execute: jest.Mock }\n}\n\ndescribe('ExecuteWithPolicy decorator', () => {\n  describe('policy execution', () => {\n    it('should invoke policy.execute exactly once per call', async () => {\n      const stubSignal = new AbortController().signal\n      const stubPolicy = buildStubPolicy(stubSignal)\n      const response = { data: 'ok', status: 200 } as AxiosResponse\n\n      class TestClient {\n        constructor(public policy: IPolicy<"+"IDefaultPolicyContext, unknown>) {}\n\n        @ExecuteWithPolicy()\n        get(_url: string): unknown {\n          return of(response)\n        }\n      }\n\n      const client = new TestClient(stubPolicy)\n      await client.get('/users')\n\n      expect(stubPolicy.execute).toHaveBeenCalledTimes(1)\n      expect(stubPolicy.execute).toHaveBeenCalledWith(expect.any(Function))\n    })\n\n    it('should call original method inside executor with original args and unwrap Observable via firstValueFrom', async () => {\n      const stubPolicy = buildStubPolicy(new AbortController().signal)\n      const methodSpy = jest.fn()\n      const response = { data: 'unwrapped', status: 200 } as AxiosResponse\n\n      class TestClient {\n        constructor(public policy: IPolicy<"+"IDefaultPolicyContext, unknown>) {}\n\n        @ExecuteWithPolicy()\n        get(url: string, config?: object): unknown {\n          methodSpy(url, config)\n          return of(response)\n        }\n      }\n\n      const client = new TestClient(stubPolicy)\n      const result = await client.get('/items', { headers: { 'x-trace': '42' } })\n\n      expect(methodSpy).toHaveBeenCalledTimes(1)\n      expect(methodSpy).toHaveBeenCalledWith('/items', { headers: { 'x-trace': '42' } })\n      expect(result).toBe(response)\n    })\n\n    it('should read `policy` lazily from the instance at call time, not at decoration time', async () => {\n      const initialPolicy = buildStubPolicy(new AbortController().signal)\n      const swappedPolicy = buildStubPolicy(new AbortController().signal)\n\n      class TestClient {\n        public policy: IPolicy<"+"IDefaultPolicyContext, unknown>\n\n        constructor(initial: IPolicy<"+"IDefaultPolicyContext, unknown>) {\n          this.policy = initial\n        }\n\n        @ExecuteWithPolicy()\n        get(_url: string): unknown {\n          return of({ data: 'ok', status: 200 } as AxiosResponse)\n        }\n      }\n\n      const client = new TestClient(initialPolicy)\n      client.policy = swappedPolicy\n\n      await client.get('/swap')\n\n      expect(initialPolicy.execute).not.toHaveBeenCalled()\n      expect(swappedPolicy.execute).toHaveBeenCalledTimes(1)\n    })\n  })\n\n  describe('signal forwarding for `request` propertyKey', () => {\n    it('should inject `policyCtx.signal` into args[0] for `request` method', async () => {\n      const stubSignal = new AbortController().signal\n      const stubPolicy = buildStubPolicy(stubSignal)\n      const methodSpy = jest.fn()\n\n      class TestClient {\n        constructor(public policy: IPolicy<"+"IDefaultPolicyContext, unknown>) {}\n\n        @ExecuteWithPolicy()\n        request(config: { url: string, signal?: AbortSignal }): unknown {\n          methodSpy(config)\n          return of({ data: config, status: 200 } as AxiosResponse)\n        }\n      }\n\n      const client = new TestClient(stubPolicy)\n      await client.request({ url: '/raw' })\n\n      expect(methodSpy).toHaveBeenCalledTimes(1)\n      const passedConfig = methodSpy.mock.calls[0]![0] as { url: string, signal?: AbortSignal }\n      expect(passedConfig.url).toBe('/raw')\n      expect(passedConfig.signal).toBe(stubSignal)\n    })\n\n    it('should default to an empty config when args[0] is undefined for `request`', async () => {\n      const stubSignal = new AbortController().signal\n      const stubPolicy = buildStubPolicy(stubSignal)\n      const methodSpy = jest.fn()\n\n      class TestClient {\n        constructor(public policy: IPolicy<"+"IDefaultPolicyContext, unknown>) {}\n\n        @ExecuteWithPolicy()\n        request(config?: { signal?: AbortSignal }) {\n          methodSpy(config)\n          return of({ data: 'ok', status: 200 } as AxiosResponse)\n        }\n      }\n\n      const client = new TestClient(stubPolicy)\n      await (client.request as unknown as (config?: { signal?: AbortSignal }) => Promise<"+"AxiosResponse>)()\n\n      expect(methodSpy).toHaveBeenCalledTimes(1)\n      const passedConfig = methodSpy.mock.calls[0]![0] as { signal?: AbortSignal }\n      expect(passedConfig.signal).toBe(stubSignal)\n    })\n  })\n\n  describe('non-observable return values', () => {\n    it('awaits a Promise return value when the wrapped method does not return an Observable', async () => {\n      const stubPolicy = buildStubPolicy(new AbortController().signal)\n      const response = { data: 'promise-return', status: 200 } as AxiosResponse\n\n      class TestClient {\n        constructor(public policy: IPolicy<"+"IDefaultPolicyContext, unknown>) {}\n\n        // Returning a Promise<"+"AxiosResponse> directly exercises the `await result`\n        // branch of the decorator (line 79), bypassing `firstValueFrom`.\n        @ExecuteWithPolicy()\n        get(_url: string): unknown {\n          return Promise.resolve(response)\n        }\n      }\n\n      const client = new TestClient(stubPolicy)\n      const result = await client.get('/promise')\n\n      expect(result).toBe(response)\n    })\n\n    it('awaits a synchronous (non-Promise, non-Observable) return value', async () => {\n      const stubPolicy = buildStubPolicy(new AbortController().signal)\n      const response = { data: 'sync-return', status: 200 } as AxiosResponse\n\n      class TestClient {\n        constructor(public policy: IPolicy<"+"IDefaultPolicyContext, unknown>) {}\n\n        @ExecuteWithPolicy()\n        get(_url: string): unknown {\n          return response\n        }\n      }\n\n      const client = new TestClient(stubPolicy)\n      const result = await client.get('/sync')\n\n      expect(result).toBe(response)\n    })\n  })\n\n  describe('signal NOT forwarded for non-`request` methods', () => {\n    it('should NOT inject signal into args for `get`', async () => {\n      const stubPolicy = buildStubPolicy(new AbortController().signal)\n      const methodSpy = jest.fn()\n\n      class TestClient {\n        constructor(public policy: IPolicy<"+"IDefaultPolicyContext, unknown>) {}\n\n        @ExecuteWithPolicy()\n        get(url: string, config?: object): unknown {\n          methodSpy(url, config)\n          return of({ data: 'ok', status: 200 } as AxiosResponse)\n        }\n      }\n\n      const client = new TestClient(stubPolicy)\n      await client.get('/safe', { headers: { 'x-trace': '7' } })\n\n      expect(methodSpy).toHaveBeenCalledWith('/safe', { headers: { 'x-trace': '7' } })\n      // The config passed to get must remain unmutated — no signal injection.\n      const calledConfig = methodSpy.mock.calls[0]![1] as Record<"+"string, unknown>\n      expect(calledConfig).not.toHaveProperty('signal')\n    })\n\n    it('should NOT inject signal into args for `post`', async () => {\n      const stubPolicy = buildStubPolicy(new AbortController().signal)\n      const methodSpy = jest.fn()\n\n      class TestClient {\n        constructor(public policy: IPolicy<"+"IDefaultPolicyContext, unknown>) {}\n\n        @ExecuteWithPolicy()\n        post(url: string, data?: unknown, config?: object): unknown {\n          methodSpy(url, data, config)\n          return of({ data: 'ok', status: 200 } as AxiosResponse)\n        }\n      }\n\n      const client = new TestClient(stubPolicy)\n      await client.post('/submit', { id: 1 }, { headers: { 'x-id': 'a' } })\n\n      expect(methodSpy).toHaveBeenCalledWith(\n        '/submit',\n        { id: 1 },\n        { headers: { 'x-id': 'a' } },\n      )\n      const calledData = methodSpy.mock.calls[0]![1] as Record<"+"string, unknown>\n      expect(calledData).not.toHaveProperty('signal')\n    })\n  })\n})\n"},"src/__tests__/axios.spec.ts":{"tests":[{"id":"237","name":"getRequestRoute non-axios / missing config short-circuit returns the literal string \"unknown\" for a plain Error","location":{"start":{"column":6,"line":25}}},{"id":"238","name":"getRequestRoute non-axios / missing config short-circuit returns \"unknown\" for null, undefined, primitives","location":{"start":{"column":6,"line":32}}},{"id":"239","name":"getRequestRoute non-axios / missing config short-circuit returns \"unknown\" for an axios error without config","location":{"start":{"column":6,"line":39}}},{"id":"240","name":"getRequestRoute method + url formatting returns \"METHOD URL\" with method uppercased and no querystring","location":{"start":{"column":6,"line":50}}},{"id":"241","name":"getRequestRoute method + url formatting uppercases lowercase methods","location":{"start":{"column":6,"line":60}}},{"id":"242","name":"getRequestRoute method + url formatting preserves already-uppercase methods","location":{"start":{"column":6,"line":69}}},{"id":"243","name":"getRequestRoute method + url formatting returns \"undefined URL\" when method is absent","location":{"start":{"column":6,"line":78}}},{"id":"244","name":"getRequestRoute method + url formatting returns \"METHOD undefined\" when url is absent","location":{"start":{"column":6,"line":87}}},{"id":"245","name":"getRequestRoute querystring formatting from config.params serialises params into a leading-? querystring","location":{"start":{"column":6,"line":95}}},{"id":"246","name":"getRequestRoute querystring formatting from config.params omits the querystring entirely when params is absent","location":{"start":{"column":6,"line":110}}},{"id":"247","name":"getRequestRoute querystring formatting from config.params renders a bare `?` when params is an empty object","location":{"start":{"column":6,"line":120}}},{"id":"248","name":"getRequestRoute querystring formatting from config.params URL-encodes special characters via URLSearchParams","location":{"start":{"column":6,"line":133}}}],"source":"import type { AxiosError } from 'axios'\n\nimport { getRequestRoute } from '../axios'\n\n/**\n * Build a synthetic AxiosError-like object that satisfies `isAxiosError`.\n *\n * Mirrors the fixture shape used by `should-retry.spec.ts` so the suite is\n * consistent across the package. `isAxiosError` only checks the truthy\n * `isAxiosError` flag, so any plain `Error` augmented with that flag and a\n * `config` member is recognised by `axios.isAxiosError`.\n */\nfunction makeAxiosError(config: AxiosError['config']): Error {\n  const error = new Error('test') as Error & {\n    isAxiosError: boolean\n    config?: AxiosError['config']\n  }\n  error.isAxiosError = true\n  error.config = config\n  return error\n}\n\ndescribe('getRequestRoute', () => {\n  describe('non-axios / missing config short-circuit', () => {\n    it('returns the literal string \"unknown\" for a plain Error', () => {\n      // Non-axios errors have no `isAxiosError` flag set, so the function\n      // short-circuits and returns the sentinel string. The exact spelling\n      // matters for log scraping; keep it pinned to \"unknown\" not \"Unknown\".\n      expect(getRequestRoute(new Error('boom'))).toBe('unknown')\n    })\n\n    it('returns \"unknown\" for null, undefined, primitives', () => {\n      expect(getRequestRoute(null)).toBe('unknown')\n      expect(getRequestRoute(undefined)).toBe('unknown')\n      expect(getRequestRoute(42)).toBe('unknown')\n      expect(getRequestRoute('string-error')).toBe('unknown')\n    })\n\n    it('returns \"unknown\" for an axios error without config', () => {\n      // The function checks for both `isAxiosError(error)` AND `error.config`.\n      // A truthy `isAxiosError` flag with an undefined `config` must still\n      // route to the unknown branch.\n      const error = new Error('no-config') as Error & { isAxiosError: boolean }\n      error.isAxiosError = true\n      expect(getRequestRoute(error as unknown as Error)).toBe('unknown')\n    })\n  })\n\n  describe('method + url formatting', () => {\n    it('returns \"METHOD URL\" with method uppercased and no querystring', () => {\n      const error = makeAxiosError({\n        method: 'get',\n        url: 'https://api.example.com/users',\n      } as AxiosError['config'])\n\n      // Method always uppercased; `?` is omitted when no params are present.\n      expect(getRequestRoute(error)).toBe('GET https://api.example.com/users')\n    })\n\n    it('uppercases lowercase methods', () => {\n      const error = makeAxiosError({\n        method: 'post',\n        url: '/items',\n      } as AxiosError['config'])\n\n      expect(getRequestRoute(error)).toBe('POST /items')\n    })\n\n    it('preserves already-uppercase methods', () => {\n      const error = makeAxiosError({\n        method: 'PUT',\n        url: '/items/1',\n      } as AxiosError['config'])\n\n      expect(getRequestRoute(error)).toBe('PUT /items/1')\n    })\n\n    it('returns \"undefined URL\" when method is absent', () => {\n      // When `config.method` is missing, `method?.toUpperCase()` resolves to\n      // undefined and is interpolated as the literal string \"undefined\".\n      // This is intentional behaviour — log scrapers filter on it.\n      const error = makeAxiosError({ url: '/no-method' } as AxiosError['config'])\n\n      expect(getRequestRoute(error)).toBe('undefined /no-method')\n    })\n\n    it('returns \"METHOD undefined\" when url is absent', () => {\n      const error = makeAxiosError({ method: 'get' } as AxiosError['config'])\n\n      expect(getRequestRoute(error)).toBe('GET undefined')\n    })\n  })\n\n  describe('querystring formatting from config.params', () => {\n    it('serialises params into a leading-? querystring', () => {\n      const error = makeAxiosError({\n        method: 'get',\n        url: '/search',\n        params: { q: 'cats', limit: '10' },\n      } as AxiosError['config'])\n\n      // URLSearchParams renders key/value pairs joined by `&`; the result\n      // must start with `?` and pass values through untouched.\n      const route = getRequestRoute(error)\n      expect(route.startsWith('GET /search?')).toBe(true)\n      expect(route).toContain('q=cats')\n      expect(route).toContain('limit=10')\n    })\n\n    it('omits the querystring entirely when params is absent', () => {\n      const error = makeAxiosError({\n        method: 'get',\n        url: '/no-params',\n      } as AxiosError['config'])\n\n      // No params -> no leading `?`; the returned route ends at the URL.\n      expect(getRequestRoute(error)).toBe('GET /no-params')\n    })\n\n    it('renders a bare `?` when params is an empty object', () => {\n      const error = makeAxiosError({\n        method: 'get',\n        url: '/empty-params',\n        params: {},\n      } as AxiosError['config'])\n\n      // Empty params object is still truthy, so the function appends `?` with\n      // no body. This pins the documented behaviour against a future\n      // refactor that might `Object.keys(params).length === 0`-skip it.\n      expect(getRequestRoute(error)).toBe('GET /empty-params?')\n    })\n\n    it('URL-encodes special characters via URLSearchParams', () => {\n      const error = makeAxiosError({\n        method: 'get',\n        url: '/search',\n        params: { q: 'foo bar', code: 'a=b&c' },\n      } as AxiosError['config'])\n\n      const route = getRequestRoute(error)\n      // URLSearchParams encodes spaces as `+` and `&`/`=` as `%26`/`%3D`.\n      expect(route).toContain('q=foo+bar')\n      expect(route).toContain('code=a%3Db%26c')\n    })\n  })\n})\n"},"src/__tests__/deduplicate-inflight.decorator.spec.ts":{"tests":[{"id":"249","name":"DeduplicateInflight decorator promise coalescing should deduplicate concurrent calls with same key so method executes only once","location":{"start":{"column":6,"line":5}}},{"id":"250","name":"DeduplicateInflight decorator promise coalescing should return the same promise reference for concurrent calls with same key","location":{"start":{"column":6,"line":33}}},{"id":"251","name":"DeduplicateInflight decorator cleanup on success should remove key from inflightMap after successful resolution","location":{"start":{"column":6,"line":56}}},{"id":"252","name":"DeduplicateInflight decorator cleanup on error should remove key from inflightMap after rejection","location":{"start":{"column":6,"line":76}}},{"id":"253","name":"DeduplicateInflight decorator cleanup on error should propagate error to all callers sharing the same inflight promise","location":{"start":{"column":6,"line":94}}},{"id":"254","name":"DeduplicateInflight decorator independent keys should execute method independently for different keys","location":{"start":{"column":6,"line":123}}},{"id":"255","name":"DeduplicateInflight decorator key builder with multiple arguments should pass all method arguments to the key builder function","location":{"start":{"column":6,"line":152}}}],"source":"import { DeduplicateInflight } from '../deduplicate-inflight.decorator'\n\ndescribe('DeduplicateInflight decorator', () => {\n  describe('promise coalescing', () => {\n    it('should deduplicate concurrent calls with same key so method executes only once', async () => {\n      const methodSpy = jest.fn()\n      let resolveMethod!: (value: string) => void\n\n      class TestService {\n        readonly inflightMap = new Map<"+"string, Promise<"+"unknown>>()\n\n        @DeduplicateInflight((id: string) => id)\n        async fetchData(id: string): Promise<"+"string> {\n          methodSpy(id)\n          return new Promise<"+"string>(resolve => (resolveMethod = resolve))\n        }\n      }\n\n      const service = new TestService()\n\n      const call1 = service.fetchData('key-1')\n      const call2 = service.fetchData('key-1')\n\n      resolveMethod('result-1')\n\n      const [result1, result2] = await Promise.all([call1, call2])\n\n      expect(methodSpy).toHaveBeenCalledTimes(1)\n      expect(result1).toBe('result-1')\n      expect(result2).toBe('result-1')\n    })\n\n    it('should return the same promise reference for concurrent calls with same key', async () => {\n      class TestService {\n        readonly inflightMap = new Map<"+"string, Promise<"+"unknown>>()\n\n        @DeduplicateInflight((id: string) => id)\n        async fetchData(id: string): Promise<"+"string> {\n          return `result-${id}`\n        }\n      }\n\n      const service = new TestService()\n\n      // Access inflightMap to verify same promise is stored\n      const call1 = service.fetchData('same-key')\n\n      // While call1 is inflight, inflightMap should contain the promise\n      expect(service.inflightMap.has('same-key')).toBe(true)\n\n      await call1\n    })\n  })\n\n  describe('cleanup on success', () => {\n    it('should remove key from inflightMap after successful resolution', async () => {\n      class TestService {\n        readonly inflightMap = new Map<"+"string, Promise<"+"unknown>>()\n\n        @DeduplicateInflight((id: string) => id)\n        async fetchData(id: string): Promise<"+"string> {\n          return `result-${id}`\n        }\n      }\n\n      const service = new TestService()\n\n      await service.fetchData('cleanup-key')\n\n      expect(service.inflightMap.has('cleanup-key')).toBe(false)\n      expect(service.inflightMap.size).toBe(0)\n    })\n  })\n\n  describe('cleanup on error', () => {\n    it('should remove key from inflightMap after rejection', async () => {\n      class TestService {\n        readonly inflightMap = new Map<"+"string, Promise<"+"unknown>>()\n\n        @DeduplicateInflight((id: string) => id)\n        async fetchData(id: string): Promise<"+"string> {\n          throw new Error(`fail-${id}`)\n        }\n      }\n\n      const service = new TestService()\n\n      await expect(service.fetchData('error-key')).rejects.toThrow('fail-error-key')\n\n      expect(service.inflightMap.has('error-key')).toBe(false)\n      expect(service.inflightMap.size).toBe(0)\n    })\n\n    it('should propagate error to all callers sharing the same inflight promise', async () => {\n      const methodSpy = jest.fn()\n      let rejectMethod!: (error: Error) => void\n\n      class TestService {\n        readonly inflightMap = new Map<"+"string, Promise<"+"unknown>>()\n\n        @DeduplicateInflight((id: string) => id)\n        async fetchData(id: string): Promise<"+"string> {\n          methodSpy(id)\n          return new Promise<"+"string>((_resolve, reject) => (rejectMethod = reject))\n        }\n      }\n\n      const service = new TestService()\n\n      const call1 = service.fetchData('fail-key')\n      const call2 = service.fetchData('fail-key')\n\n      rejectMethod(new Error('shared failure'))\n\n      await expect(call1).rejects.toThrow('shared failure')\n      await expect(call2).rejects.toThrow('shared failure')\n      expect(methodSpy).toHaveBeenCalledTimes(1)\n      expect(service.inflightMap.size).toBe(0)\n    })\n  })\n\n  describe('independent keys', () => {\n    it('should execute method independently for different keys', async () => {\n      const methodSpy = jest.fn()\n\n      class TestService {\n        readonly inflightMap = new Map<"+"string, Promise<"+"unknown>>()\n\n        @DeduplicateInflight((id: string) => id)\n        async fetchData(id: string): Promise<"+"string> {\n          methodSpy(id)\n          return `result-${id}`\n        }\n      }\n\n      const service = new TestService()\n\n      const [result1, result2] = await Promise.all([\n        service.fetchData('key-a'),\n        service.fetchData('key-b'),\n      ])\n\n      expect(methodSpy).toHaveBeenCalledTimes(2)\n      expect(methodSpy).toHaveBeenCalledWith('key-a')\n      expect(methodSpy).toHaveBeenCalledWith('key-b')\n      expect(result1).toBe('result-key-a')\n      expect(result2).toBe('result-key-b')\n    })\n  })\n\n  describe('key builder with multiple arguments', () => {\n    it('should pass all method arguments to the key builder function', async () => {\n      const keyBuilderSpy = jest.fn((userId: string, version: string) => `${version}:${userId}`)\n\n      class TestService {\n        readonly inflightMap = new Map<"+"string, Promise<"+"unknown>>()\n\n        @DeduplicateInflight(keyBuilderSpy)\n        async fetchData(_userId: string, _version: string): Promise<"+"string> {\n          return 'data'\n        }\n      }\n\n      const service = new TestService()\n\n      await service.fetchData('user-1', 'v2')\n\n      expect(keyBuilderSpy).toHaveBeenCalledWith('user-1', 'v2')\n    })\n  })\n})\n"},"src/__tests__/index.spec.ts":{"tests":[{"id":"256","name":"public surface  } from '../auth/auth-rest.client'\nimport { AuthStrategyService } from '../auth/auth-strategy.service'\nimport { AuthRestModule } from '../auth/auth-rest.module'\nimport { ExecuteWithPolicy } from '../client/execute-with-policy.decorator'\nimport { Authenticate } from '../auth/authenticate.decorator'\nimport { DeduplicateInflight } from '../deduplicate-inflight.decorator'\nimport {\n  ResilencePresets as DirectResilencePresets,\n  resiliencePolicyPresets as directResiliencePolicyPresets,\n} from '../resilence.policy'\n\n/**\n * The package's barrel file (`src/index.ts`) is the consumer-facing surface.\n * Drift between what's documented in README and what's exported is a\n * silent-but-deadly regression because `tsdown` happily bundles whatever the\n * barrel exposes.\n *\n * This spec pins both the runtime symbols (classes + decorator factories +\n * the preset enum/lookup) and the type-only re-exports (which obviously\n * vanish at runtime but are validated by the compile step).\n */\ndescribe('public surface (src/index.ts)', () => {\n  describe('runtime class re-exports', () => {\n    it('exports the RestClient class identical to the source class', () => {\n      expect(publicSurface.RestClient).toBe(RestClient)\n    })\n\n    it('exports the AuthRestClient class identical to the source class', () => {\n      expect(publicSurface.AuthRestClient).toBe(AuthRestClient)\n    })\n\n    it('exports the AuthStrategyService class identical to the source class', () => {\n      expect(publicSurface.AuthStrategyService).toBe(AuthStrategyService)\n    })\n\n    it('exports the AuthRestModule class identical to the source class', () => {\n      expect(publicSurface.AuthRestModule).toBe(AuthRestModule)\n    })\n  })\n\n  describe('decorator factory re-exports', () => {\n    it('exports the ExecuteWithPolicy decorator identical to the source factory', () => {\n      expect(publicSurface.ExecuteWithPolicy).toBe(ExecuteWithPolicy)\n    })\n\n    it('exports the Authenticate decorator identical to the source factory', () => {\n      expect(publicSurface.Authenticate).toBe(Authenticate)\n    })\n\n    it('exports the DeduplicateInflight decorator identical to the source factory', () => {\n      expect(publicSurface.DeduplicateInflight).toBe(DeduplicateInflight)\n    })\n  })\n\n  describe('resilience preset re-exports', () => {\n    it('exports the ResilencePresets enum with stable string values', () => {\n      // ResilencePresets is both a value (object) and a type. Pinning the\n      // string values here guards against accidental renames that would\n      // silently break consumers using `resiliencePolicyPresets[ResilencePresets.X]`.\n      expect(publicSurface.ResilencePresets).toBe(DirectResilencePresets)\n      expect(publicSurface.ResilencePresets.CONSERVATIVE).toBe('conservative')\n      expect(publicSurface.ResilencePresets.RESTFULL).toBe('restfull')\n      expect(publicSurface.ResilencePresets.LOW_QUALITY).toBe('low-quality')\n    })\n\n    it('exports the resiliencePolicyPresets lookup keyed by every preset value', () => {\n      expect(publicSurface.resiliencePolicyPresets).toBe(directResiliencePolicyPresets)\n      // Must contain a config entry for every enum member; missing presets\n      // surface as `undefined` indexing at consumer call sites.\n      for (const preset of Object.values(publicSurface.ResilencePresets)) {\n        expect(publicSurface.resiliencePolicyPresets[preset]).toBeDefined()\n      }\n    })\n  })\n\n  describe('exhaustive named export list', () => {\n    it('exports exactly the runtime + enum + lookup symbols documented in README', () => {\n      // Type-only exports (AuthConfig, AuthStrategy, ResilanceConfig, etc.)\n      // are erased at runtime; the runtime keys must therefore be exactly the\n      // 9 symbols below. Drift here is a public-API change.\n      const actualKeys = Object.keys(publicSurface).sort()\n      expect(actualKeys).toEqual(\n        [\n          'Authenticate',\n          'AuthRestClient',\n          'AuthRestModule',\n          'AuthStrategyService',\n          'DeduplicateInflight',\n          'ExecuteWithPolicy',\n          'ResilencePresets',\n          'RestClient',\n          'resiliencePolicyPresets',\n        ].sort(),\n      )\n    })\n  })\n})\n"}},"projectRoot":"/workspaces/nestjs-http-client","config":{"testRunner":"jest","jest":{"configFile":"jest.config.ts","projectType":"custom","enableFindRelatedTests":true},"checkers":["typescript"],"tsconfigFile":"tsconfig.test.json","mutate":["src/**/*.ts","!src/**/__tests__/**"],"ignoreStatic":true,"thresholds":{"high":80,"low":70,"break":80},"reporters":["html","progress","json"],"tempDirName":"stryker-tmp","allowConsoleColors":true,"checkerNodeArgs":[],"commandRunner":{"command":"npm test"},"coverageAnalysis":"perTest","clearTextReporter":{"allowColor":true,"allowEmojis":false,"logTests":true,"maxTestsToLog":3,"reportTests":true,"reportMutants":true,"reportScoreTable":true,"skipFull":false},"dashboard":{"baseUrl":"https://dashboard.stryker-mutator.io/api/reports","reportType":"full"},"dryRunOnly":false,"eventReporter":{"baseDir":"reports/mutation/events"},"ignorePatterns":[],"incremental":false,"incrementalFile":"reports/stryker-incremental.json","force":false,"fileLogLevel":"off","inPlace":false,"logLevel":"info","maxConcurrentTestRunners":9007199254740991,"maxTestRunnerReuse":0,"mutator":{"plugins":null,"excludedMutations":[]},"plugins":["@stryker-mutator/*"],"appendPlugins":[],"htmlReporter":{"fileName":"reports/mutation/mutation.html"},"jsonReporter":{"fileName":"reports/mutation/mutation.json"},"disableTypeChecks":true,"symlinkNodeModules":true,"cleanTempDir":true,"testRunnerNodeArgs":[],"timeoutFactor":1.5,"timeoutMS":5000,"dryRunTimeoutMinutes":5,"warnings":true,"disableBail":false,"allowEmpty":false,"ignorers":[],"typescriptChecker":{"prioritizePerformanceOverAccuracy":true}},"framework":{"name":"StrykerJS","version":"8.7.1","branding":{"homepageUrl":"https://stryker-mutator
