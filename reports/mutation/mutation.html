redBy":["9","26","38"],"location":{"end":{"column":4,"line":123},"start":{"column":116,"line":121}}}],"source":"import type { HttpService } from '@nestjs/axios'\nimport { Logger } from '@nestjs/common'\nimport type {\n  AxiosInstance,\n  AxiosRequestConfig,\n  AxiosResponse,\n} from 'axios'\nimport type {\n  IDefaultPolicyContext,\n  IPolicy,\n} from 'cockatiel'\nimport type { Loggable } from 'nestjs-log-decorator'\n\nimport { resiliencePolicyPresets, ResilencePresets } from '../resilence.policy'\nimport { ExecuteWithPolicy } from './execute-with-policy.decorator'\nimport { resiliencePolicyBuilder } from './resailencePolicyBuilder'\nimport type { ResilanceConfig } from './resilance.config'\n\n/**\n * Resilient HTTP client that wraps `@nestjs/axios`'s `HttpService` and runs\n * every request through a composed cockatiel `IPolicy`.\n *\n * Each verb method delegates to the underlying `HttpService` (which returns an\n * `Observable<"+"AxiosResponse>`); the `@ExecuteWithPolicy` decorator wraps that\n * Observable in `policy.execute` and unwraps it via `firstValueFrom`, so the\n * publicly observable return type is `Promise<"+"AxiosResponse<"+"...>>`.\n *\n * The `policy` field is public (read-only) because `@ExecuteWithPolicy` reads\n * it from the instance at call time via `context.target.policy`.\n */\nexport class RestClient implements Loggable {\n  /** NestJS logger; required by `Loggable` from `nestjs-log-decorator`. */\n  readonly logger: Logger = new Logger(RestClient.name)\n\n  /**\n   * Composed resilience policy used by `@ExecuteWithPolicy` to wrap every\n   * request. Public so the decorator can read it from the instance via\n   * `context.target.policy` on each invocation. The `any` result-type on\n   * `IPolicy` mirrors the heterogeneous `AxiosResponse<"+"T, D>` shapes that flow\n   * through every verb.\n   */\n  // eslint-disable-next-line @typescript-eslint/no-explicit-any -- IPolicy result type must be `any` because per-verb response shapes vary across calls\n  readonly policy: IPolicy<"+"IDefaultPolicyContext, any>\n\n  constructor(\n    private readonly httpService: HttpService,\n    config: ResilanceConfig<"+"unknown> = resiliencePolicyPresets[ResilencePresets.CONSERVATIVE],\n  ) {\n    this.policy = resiliencePolicyBuilder(config)\n  }\n\n  /** Underlying axios instance — exposed for adapter-level interop. */\n  get axiosRef(): AxiosInstance {\n    return this.httpService.axiosRef\n  }\n\n  // Each verb below returns the Observable from `HttpService`; the decorator\n  // unwraps it via `firstValueFrom` and wraps the call in `policy.execute`,\n  // so the *runtime* return value is a `Promise<"+"AxiosResponse<"+"...>>`.\n  // The cast to `Promise<"+"...>` aligns the *declared* type with that runtime\n  // contract (matching the RestClient Contract in the task spec).\n  // The `request` propertyKey is special-cased by the decorator to inject\n  // `policyCtx.signal` into args[0] so axios receives a cancellable signal.\n\n  @ExecuteWithPolicy()\n  // eslint-disable-next-line @typescript-eslint/no-explicit-any -- mirrors HttpService.request<"+"T = any>; restructuring to `unknown` would force every consumer to narrow `response.data` even when calling without an explicit type arg, breaking API parity with @nestjs/axios\n  request<"+"T = any>(config: AxiosRequestConfig): Promise<"+"AxiosResponse<"+"T>> {\n    return this.httpService.request<"+"T>(config) as unknown as Promise<"+"AxiosResponse<"+"T>>\n  }\n\n  @ExecuteWithPolicy()\n  // eslint-disable-next-line @typescript-eslint/no-explicit-any -- mirrors HttpService.get<"+"T = any, D = any>; see `request` for rationale\n  get<"+"T = any, D = any>(url: string, config?: AxiosRequestConfig<"+"D>): Promise<"+"AxiosResponse<"+"T, D>> {\n    return this.httpService.get<"+"T, D>(url, config) as unknown as Promise<"+"AxiosResponse<"+"T, D>>\n  }\n\n  @ExecuteWithPolicy()\n  // eslint-disable-next-line @typescript-eslint/no-explicit-any -- mirrors HttpService.delete<"+"T = any, D = any>; see `request` for rationale\n  delete<"+"T = any, D = any>(url: string, config?: AxiosRequestConfig<"+"D>): Promise<"+"AxiosResponse<"+"T, D>> {\n    return this.httpService.delete<"+"T, D>(url, config) as unknown as Promise<"+"AxiosResponse<"+"T, D>>\n  }\n\n  @ExecuteWithPolicy()\n  // eslint-disable-next-line @typescript-eslint/no-explicit-any -- mirrors HttpService.head<"+"T = any, D = any>; see `request` for rationale\n  head<"+"T = any, D = any>(url: string, config?: AxiosRequestConfig<"+"D>): Promise<"+"AxiosResponse<"+"T, D>> {\n    return this.httpService.head<"+"T, D>(url, config) as unknown as Promise<"+"AxiosResponse<"+"T, D>>\n  }\n\n  @ExecuteWithPolicy()\n  // eslint-disable-next-line @typescript-eslint/no-explicit-any -- mirrors HttpService.post<"+"T = any, D = any>; see `request` for rationale\n  post<"+"T = any, D = any>(url: string, data?: D, config?: AxiosRequestConfig<"+"D>): Promise<"+"AxiosResponse<"+"T, D>> {\n    return this.httpService.post<"+"T, D>(url, data, config) as unknown as Promise<"+"AxiosResponse<"+"T, D>>\n  }\n\n  @ExecuteWithPolicy()\n  // eslint-disable-next-line @typescript-eslint/no-explicit-any -- mirrors HttpService.put<"+"T = any, D = any>; see `request` for rationale\n  put<"+"T = any, D = any>(url: string, data?: D, config?: AxiosRequestConfig<"+"D>): Promise<"+"AxiosResponse<"+"T, D>> {\n    return this.httpService.put<"+"T, D>(url, data, config) as unknown as Promise<"+"AxiosResponse<"+"T, D>>\n  }\n\n  @ExecuteWithPolicy()\n  // eslint-disable-next-line @typescript-eslint/no-explicit-any -- mirrors HttpService.patch<"+"T = any, D = any>; see `request` for rationale\n  patch<"+"T = any, D = any>(url: string, data?: D, config?: AxiosRequestConfig<"+"D>): Promise<"+"AxiosResponse<"+"T, D>> {\n    return this.httpService.patch<"+"T, D>(url, data, config) as unknown as Promise<"+"AxiosResponse<"+"T, D>>\n  }\n\n  @ExecuteWithPolicy()\n  // eslint-disable-next-line @typescript-eslint/no-explicit-any -- mirrors HttpService.postForm<"+"T = any, D = any>; see `request` for rationale\n  postForm<"+"T = any, D = any>(url: string, data?: D, config?: AxiosRequestConfig<"+"D>): Promise<"+"AxiosResponse<"+"T, D>> {\n    return this.httpService.postForm<"+"T, D>(url, data, config) as unknown as Promise<"+"AxiosResponse<"+"T, D>>\n  }\n\n  @ExecuteWithPolicy()\n  // eslint-disable-next-line @typescript-eslint/no-explicit-any -- mirrors HttpService.putForm<"+"T = any, D = any>; see `request` for rationale\n  putForm<"+"T = any, D = any>(url: string, data?: D, config?: AxiosRequestConfig<"+"D>): Promise<"+"AxiosResponse<"+"T, D>> {\n    return this.httpService.putForm<"+"T, D>(url, data, config) as unknown as Promise<"+"AxiosResponse<"+"T, D>>\n  }\n\n  @ExecuteWithPolicy()\n  // eslint-disable-next-line @typescript-eslint/no-explicit-any -- mirrors HttpService.patchForm<"+"T = any, D = any>; see `request` for rationale\n  patchForm<"+"T = any, D = any>(url: string, data?: D, config?: AxiosRequestConfig<"+"D>): Promise<"+"AxiosResponse<"+"T, D>> {\n    return this.httpService.patchForm<"+"T, D>(url, data, config) as unknown as Promise<"+"AxiosResponse<"+"T, D>>\n  }\n}\n"}},"schemaVersion":"1.0","thresholds":{"high":80,"low":70,"break":80},"testFiles":{"src/client/__tests__/rest.client.spec.ts":{"tests":[{"id":"0","name":"RestClient per-verb policy pass-through (mock policy + axios) request invokes policy.execute exactly once and underlying httpService.%s exactly once","location":{"start":{"column":24,"line":144}}},{"id":"1","name":"RestClient per-verb policy pass-through (mock policy + axios) get invokes policy.execute exactly once and underlying httpService.%s exactly once","location":{"start":{"column":24,"line":144}}},{"id":"2","name":"RestClient per-verb policy pass-through (mock policy + axios) delete invokes policy.execute exactly once and underlying httpService.%s exactly once","location":{"start":{"column":24,"line":144}}},{"id":"3","name":"RestClient per-verb policy pass-th el'\nimport type { IDefaultPolicyContext, IPolicy } from 'cockatiel'\nimport type { AxiosError, AxiosResponse } from 'axios'\n\nimport { RestClient } from '../rest.client'\nimport { resiliencePolicyBuilder } from '../resailencePolicyBuilder'\nimport { resiliencePolicyPresets, ResilencePresets } from '../../resilence.policy'\nimport type { ResilanceConfig } from '../resilance.config'\n\n/**\n * Stub policy that immediately invokes the executor with a deterministic\n * `IDefaultPolicyContext` (carrying a sentinel `AbortSignal`) and returns its\n * awaited result. Constructor-injected via the `RestClient.policy` field\n * (which the spec overwrites because the field is `readonly` only in TS).\n *\n * Avoids any `jest.mock` of cockatiel/@nestjs/axios — keeps the test isolated\n * to RestClient verb dispatch + decorator semantics.\n */\nfunction buildStubPolicy(signal: AbortSignal): IPolicy<"+"IDefaultPolicyContext, unknown> & {\n  execute: jest.Mock\n} {\n  const execute = jest.fn(\n    async (fn: (ctx: IDefaultPolicyContext) => unknown | PromiseLike<"+"unknown>) => fn({ signal }),\n  )\n\n  return {\n    execute,\n    onSuccess: jest.fn(),\n    onFailure: jest.fn(),\n  } as unknown as IPolicy<"+"IDefaultPolicyContext, unknown> & { execute: jest.Mock }\n}\n\n/**\n * Minimal `HttpService`-shaped stub. Each verb returns the configured\n * `Observable<"+"AxiosResponse>` so the `@ExecuteWithPolicy` decorator can unwrap\n * it via `firstValueFrom` exactly the same way as the real `HttpService`.\n */\ntype HttpServiceStub = {\n  request: jest.Mock\n  get: jest.Mock\n  delete: jest.Mock\n  head: jest.Mock\n  post: jest.Mock\n  put: jest.Mock\n  patch: jest.Mock\n  postForm: jest.Mock\n  putForm: jest.Mock\n  patchForm: jest.Mock\n  axiosRef: unknown\n}\n\nfunction buildHttpServiceStub(response: AxiosResponse): HttpServiceStub {\n  return {\n    request: jest.fn(() => of(response)),\n    get: jest.fn(() => of(response)),\n    delete: jest.fn(() => of(response)),\n    head: jest.fn(() => of(response)),\n    post: jest.fn(() => of(response)),\n    put: jest.fn(() => of(response)),\n    patch: jest.fn(() => of(response)),\n    postForm: jest.fn(() => of(response)),\n    putForm: jest.fn(() => of(response)),\n    patchForm: jest.fn(() => of(response)),\n    axiosRef: { defaults: {} },\n  }\n}\n\n/**\n * Build a synthetic `AxiosError` fixture for `GET /resource` with a 5xx\n * status. Mirrors the construction used in `should-retry.spec.ts` so the\n * default preset's `shouldRetry` (which delegates to `isRetryableError`)\n * recognises it as retryable.\n */\nfunction makeAxiosError(method: string, status: number): AxiosError {\n  const error = new Error(`HTTP ${status}`) as Error & {\n    isAxiosError: boolean\n    response?: { status: number }\n    config?: { method: string }\n  }\n\n  error.isAxiosError = true\n  error.config = { method }\n  error.response = { status }\n\n  return error as unknown as AxiosError\n}\n\n/** All RestClient verbs the spec must exercise. */\nconst ALL_VERBS = [\n  'request',\n  'get',\n  'delete',\n  'head',\n  'post',\n  'put',\n  'patch',\n  'postForm',\n  'putForm',\n  'patchForm',\n] as const\n\ntype Verb = typeof ALL_VERBS[number]\n\n/**\n * Some verbs take `(url, config?)` while data-bearing verbs take\n * `(url, data?, config?)`. The dispatch helper builds the correct argument\n * shape per verb name so the spec can exercise all 10 verbs from a single\n * loop.\n */\nfunction callVerb(client: RestClient, verb: Verb): Promise<"+"AxiosResponse> {\n  switch (verb) {\n    case 'request':\n      return client.request({ method: 'GET', url: '/x' })\n    case 'get':\n    case 'delete':\n    case 'head':\n      return client[verb]('/x', { headers: { 'x-trace': '1' } })\n    case 'post':\n    case 'put':\n    case 'patch':\n    case 'postForm':\n    case 'putForm':\n    case 'patchForm':\n      return client[verb]('/x', { id: 1 }, { headers: { 'x-trace': '1' } })\n  }\n}\n\nconst successResponse: AxiosResponse = {\n  data: { ok: true },\n  status: 200,\n  statusText: 'OK',\n  headers: {},\n  config: {} as AxiosResponse['config'],\n}\n\ndescribe('RestClient', () => {\n  describe('per-verb policy pass-through (mock policy + axios)', () => {\n    it.each(ALL_VERBS)(\n      '%s invokes policy.execute exactly once and underlying httpService.%s exactly once',\n      async (verb) => {\n        const stubPolicy = buildStubPolicy(new AbortController().signal)\n        const stubHttp = buildHttpServiceStub(successResponse)\n\n        // Cast through `unknown` because HttpServiceStub omits private/protected\n        // fields of the real `HttpService` class. Same reason RestClient ctor\n        // is typed against `HttpService` not a structural type.\n        const client = new RestClient(stubHttp as unknown as ConstructorParameters<"+"typeof RestClient>[0])\n        // Override the readonly `policy` field with the stub. `readonly` is a\n        // compile-time annotation only — runtime assignment works and is the\n        // documented way to inject a mock policy in this codebase.\n        ;(client as unknown as { policy: unknown }).policy = stubPolicy\n\n        const result = await callVerb(client, verb)\n\n        expect(stubPolicy.execute).toHaveBeenCalledTimes(1)\n        expect(stubPolicy.execute).toHaveBeenCalledWith(expect.any(Function))\n        expect(stubHttp[verb]).toHaveBeenCalledTimes(1)\n        expect(result).toBe(successResponse)\n      },\n    )\n\n    it('passes verb-specific arguments straight through to the underlying httpService', async () => {\n      const stubPolicy = buildStubPolicy(new AbortController().signal)\n      const stubHttp = buildHttpServiceStub(successResponse)\n      const client = new RestClient(stubHttp as unknown as ConstructorParameters<"+"typeof RestClient>[0])\n      ;(client as unknown as { policy: unknown }).policy = stubPolicy\n\n      // Two-arg verbs preserve `(url, config)` in order.\n      await client.get('/items', { headers: { 'x-id': 'g' } })\n      expect(stubHttp.get).toHaveBeenCalledWith('/items', { headers: { 'x-id': 'g' } })\n\n      // Three-arg verbs preserve `(url, data, config)` in order.\n      await client.post('/items', { id: 1 }, { headers: { 'x-id': 'p' } })\n      expect(stubHttp.post).toHaveBeenCalledWith('/items', { id: 1 }, { headers: { 'x-id': 'p' } })\n    })\n  })\n\n  describe('signal forwarding for `request`', () => {\n    it('forwards `policyCtx.signal` into args[0] when calling `request`', async () => {\n      const sentinelSignal = new AbortController().signal\n      const stubPolicy = buildStubPolicy(sentinelSignal)\n      const stubHttp = buildHttpServiceStub(successResponse)\n\n      const client = new RestClient(stubHttp as unknown as ConstructorParameters<"+"typeof RestClient>[0])\n      ;(client as unknown as { policy: unknown }).policy = stubPolicy\n\n      await client.request({ method: 'GET', url: '/raw' })\n\n      expect(stubHttp.request).toHaveBeenCalledTimes(1)\n      const [passedConfig] = stubHttp.request.mock.calls[0] as [Record<"+"string, unknown>]\n      expect(passedConfig.method).toBe('GET')\n      expect(passedConfig.url).toBe('/raw')\n      // Decorator must inject the AbortSignal carried by the policy context.\n      expect(passedConfig.signal).toBe(sentinelSignal)\n    })\n\n    it('does NOT inject signal into args for non-`request` verbs (e.g. `get`)', async () => {\n      const sentinelSignal = new AbortController().signal\n      const stubPolicy = buildStubPolicy(sentinelSignal)\n      const stubHttp = buildHttpServiceStub(successResponse)\n\n      const client = new RestClient(stubHttp as unknown as ConstructorParameters<"+"typeof RestClient>[0])\n      ;(client as unknown as { policy: unknown }).policy = stubPolicy\n\n      await client.get('/users', { headers: { 'x-trace': '1' } })\n\n      const [, passedConfig] = stubHttp.get.mock.calls[0] as [string, Record<"+"string, unknown>]\n      expect(passedConfig).not.toHaveProperty('signal')\n    })\n  })\n\n  describe('default preset (constructor with no `config`)', () => {\n    it('builds a policy matching the CONSERVATIVE preset (RetryPolicy with maxAttempts=3 + CircuitBreakerPolicy)', () => {\n      const stubHttp = buildHttpServiceStub(successResponse)\n\n      const client = new RestClient(stubHttp as unknown as ConstructorParameters<"+"typeof RestClient>[0])\n\n      // CONSERVATIVE = retry + circuitBreaker — `wrap(...)` returns an object\n      // with a `wrapped` field listing the composed sub-policies. Same\n      // inspection trick used by `resilience-policy-builder.spec.ts`.\n      const wrapped = (client.policy as unknown as { wrapped: unknown[] }).wrapped\n      expect(wrapped).toHaveLength(2)\n      expect(wrapped[0]).toBeInstanceOf(RetryPolicy)\n      expect(wrapped[1]).toBeInstanceOf(CircuitBreakerPolicy)\n\n      const retryOptions = (wrapped[0] as unknown as { options: { maxAttempts: number } }).options\n      expect(retryOptions.maxAttempts).toBe(3)\n    })\n\n    it('retries safe-method 5xx errors up to maxAttempts=3 (4 total axios calls)', async () => {\n      // Use fake timers so `ExponentialBackoff`'s setTimeout-based delays do\n      // not block the test on real wall-clock time. The retry policy uses\n      // setTimeout internally — `advanceTimersByTimeAsync` flushes them.\n      jest.useFakeTimers()\n\n      try {\n        const error = makeAxiosError('GET', 500)\n        const stubHttp = buildHttpServiceStub(successResponse)\n        // Always emit the 5xx error — confirms retry stops at maxAttempts.\n        stubHttp.get.mockReturnValue(throwError(() => error))\n\n        const client = new RestClient(stubHttp as unknown as ConstructorParameters<"+"typeof RestClient>[0])\n\n        // Drive the call to completion while flushing pending timers between\n        // retries. We do not await the result up-front because the policy is\n        // suspended on `await delay(...)` between attempts.\n        const promise = client.get('/x').catch((err: unknown) => err)\n        // Default ExponentialBackoff caps at maxDelay=30s; advancing 60s twice\n        // is enough headroom to flush all three retry delays.\n        await jest.advanceTimersByTimeAsync(60_000)\n        await jest.advanceTimersByTimeAsync(60_000)\n        await promise\n\n        // maxAttempts=3 means up to 3 retries -> 4 total invocations.\n        expect(stubHttp.get).toHaveBeenCalledTimes(4)\n      }\n      finally {\n        jest.useRealTimers()\n      }\n    })\n\n    it('does NOT retry non-safe methods (e.g. POST 5xx) under the CONSERVATIVE preset', async () => {\n      const error = makeAxiosError('POST', 500)\n      const stubHttp = buildHttpServiceStub(successResponse)\n      stubHttp.post.mockReturnValue(throwError(() => error))\n\n      const client = new RestClient(stubHttp as unknown as ConstructorParameters<"+"typeof RestClient>[0])\n\n      await expect(client.post('/x', { id: 1 })).rejects.toBe(error)\n      // CONSERVATIVE retry uses `SAFE_HTTP_METHODS` only — POST is not in the\n      // allow-list, so the retry policy gives up after the first failure.\n      expect(stubHttp.post).toHaveBeenCalledTimes(1)\n    })\n  })\n\n  describe('all four cockatiel policy types in combination (composed pipeline)', () => {\n    it('exercises retry + circuitBreaker + bulkhead + fallback together with a real composed policy', async () => {\n      const fallbackResponse: AxiosResponse = {\n        data: { fallback: true },\n        status: 200,\n        statusText: 'OK (fallback)',\n        headers: {},\n        config: {} as AxiosResponse['config'],\n      }\n\n      // Real cockatiel pipeline — only axios is mocked (via the HttpService\n      // stub), satisfying the AC \"All four cockatiel policy types are\n      // exercised in combination with `RestClient`\" + the test-isolation rule\n      // that bans library-level mocks for cockatiel.\n      //\n      // Wrap order is `retry > CB > bulkhead > fallback` (retry outermost,\n      // fallback innermost), so to exercise *retry* (not just construct it),\n      // the fallback's `shouldFallback` must reject the transient errors so\n      // they propagate through bulkhead and CB up to retry. Only the *final*\n      // error matches `shouldFallback`, letting the fallback supply the\n      // synthetic AxiosResponse the test asserts on.\n      const transientError = new Error('transient-fail')\n      const finalError = new Error('final-fail')\n\n      const composedConfig: ResilanceConfig<"+"unknown, void, AxiosResponse> = {\n        retry: {\n          maxAttempts: 2, // 2 retries -> 3 total upstream calls\n          backoff: 0, // ConstantBackoff(0) — deterministic, no real delay\n          shouldRetry: (error: Error) => error.message === 'transient-fail',\n        },\n        circuitBreaker: {\n          breaker: 100, // ConsecutiveBreaker — high threshold, never trips here\n          halfOpenAfter: 60_000,\n        },\n        bulkhead: { limit: 10, queue: 10 },\n        fallback: {\n          shouldFallback: (error: Error) => error.message === 'final-fail',\n          valueOrFactory: fallbackResponse,\n        },\n      }\n\n      // Sanity-check the composed policy contains all four sub-policies in the\n      // documented order so a regression in `resiliencePolicyBuilder` does not\n      // silently drop a layer.\n      const builtPolicy = resiliencePolicyBuilder(composedConfig)\n      const wrapped = (builtPolicy as unknown as { wrapped: unknown[] }).wrapped\n      expect(wrapped).toHaveLength(4)\n      expect(wrapped[0]).toBeInstanceOf(RetryPolicy)\n      expect(wrapped[1]).toBeInstanceOf(CircuitBreakerPolicy)\n      expect(wrapped[2]).toBeInstanceOf(BulkheadPolicy)\n      expect(wrapped[3]).toBeInstanceOf(FallbackPolicy)\n\n      const stubHttp = buildHttpServiceStub(successResponse)\n      // First two calls throw `transient-fail` (retry catches and retries),\n      // third call throws `final-fail` (fallback catches and substitutes).\n      stubHttp.get\n        .mockReturnValueOnce(throwError(() => transientError))\n        .mockReturnValueOnce(throwError(() => transientError))\n        .mockReturnValueOnce(throwError(() => finalError))\n\n      const client = new RestClient(\n        stubHttp as unknown as ConstructorParameters<"+"typeof RestClient>[0],\n        composedConfig,\n      )\n\n      const result = await client.get('/x')\n\n      // Retry fires twice (total 3 calls), then the third error matches\n      // `shouldFallback` so the fallback supplies the synthetic response.\n      expect(stubHttp.get).toHaveBeenCalledTimes(3)\n      expect(result).toBe(fallbackResponse)\n    })\n\n    it('returns the upstream response unchanged when the composed pipeline succeeds (sanity check)', async () => {\n      const composedConfig: ResilanceConfig<"+"unknown, void, AxiosResponse> = {\n        retry: { maxAttempts: 0, backoff: 0 },\n        circuitBreaker: { breaker: 5, halfOpenAfter: 60_000 },\n        bulkhead: { limit: 10 },\n        fallback: { valueOrFactory: successResponse },\n      }\n      const stubHttp = buildHttpServiceStub(successResponse)\n\n      const client = new RestClient(\n        stubHttp as unknown as ConstructorParameters<"+"typeof RestClient>[0],\n        composedConfig,\n      )\n\n      const result = await client.get('/x')\n\n      expect(stubHttp.get).toHaveBeenCalledTimes(1)\n      expect(result).toBe(successResponse)\n    })\n  })\n\n  describe('per-verb argument forwarding shapes (optional config branches)', () => {\n    type IndexOneVerb = 'get' | 'delete' | 'head'\n    type IndexTwoVerb = 'post' | 'put' | 'patch' | 'postForm' | 'putForm' | 'patchForm'\n    const INDEX_ONE_VERBS: IndexOneVerb[] = ['get', 'delete', 'head']\n    const INDEX_TWO_VERBS: IndexTwoVerb[] = ['post', 'put', 'patch', 'postForm', 'putForm', 'patchForm']\n\n    it.each(INDEX_ONE_VERBS)(\n      '%s forwards (url, config) and (url) shapes to httpService.%s',\n      async (verb) => {\n        const stubPolicy = buildStubPolicy(new AbortController().signal)\n        const stubHttp = buildHttpServiceStub(successResponse)\n        const client = new RestClient(stubHttp as unknown as ConstructorParameters<"+"typeof RestClient>[0])\n        ;(client as unknown as { policy: unknown }).policy = stubPolicy\n\n        // (url, config) shape\n        await client[verb]('/with-config', { headers: { 'x-id': 'a' } })\n        expect(stubHttp[verb]).toHaveBeenLastCalledWith('/with-config', { headers: { 'x-id': 'a' } })\n\n        // (url) shape — config omitted; httpService should still receive\n        // exactly two positional arguments with the second left undefined.\n        await client[verb]('/no-config')\n        expect(stubHttp[verb]).toHaveBeenLastCalledWith('/no-config', undefined)\n      },\n    )\n\n    it.each(INDEX_TWO_VERBS)(\n      '%s forwards (url, data, config) and (url, data) shapes to httpService.%s',\n      async (verb) => {\n        const stubPolicy = buildStubPolicy(new AbortController().signal)\n        const stubHttp = buildHttpServiceStub(successResponse)\n        const client = new RestClient(stubHttp as unknown as ConstructorParameters<"+"typeof RestClient>[0])\n        ;(client as unknown as { policy: unknown }).policy = stubPolicy\n\n        // Three-arg shape preserves all positions in order.\n        await client[verb]('/with-config', { id: 1 }, { headers: { 'x-id': 'b' } })\n        expect(stubHttp[verb]).toHaveBeenLastCalledWith(\n          '/with-config',\n          { id: 1 },\n          { headers: { 'x-id': 'b' } },\n        )\n\n        // Two-arg shape — config omitted. httpService receives the third\n        // positional argument as undefined; verbs MUST NOT swallow data.\n        await client[verb]('/no-config', { id: 2 })\n        expect(stubHttp[verb]).toHaveBeenLastCalledWith('/no-config', { id: 2 }, undefined)\n      },\n    )\n\n    it('request forwards (config) and (no-arg) shapes to httpService.request', async () => {\n      const stubPolicy = buildStubPolicy(new AbortController().signal)\n      const stubHttp = buildHttpServiceStub(successResponse)\n      const client = new RestClient(stubHttp as unknown as ConstructorParameters<"+"typeof RestClient>[0])\n      ;(client as unknown as { policy: unknown }).policy = stubPolicy\n\n      // With config — signal is injected by the decorator into args[0].\n      await client.request({ url: '/explicit', method: 'GET' })\n      const calls = stubHttp.request.mock.calls\n      const lastCall = calls[calls.length - 1][0] as Record<"+"string, unknown>\n      expect(lastCall.url).toBe('/explicit')\n      expect(lastCall.method).toBe('GET')\n      expect(lastCall).toHaveProperty('signal')\n    })\n\n    it('signal injection on `request` only mutates a copy, not the caller-provided config', async () => {\n      const stubSignal = new AbortController().signal\n      const stubPolicy = buildStubPolicy(stubSignal)\n      const stubHttp = buildHttpServiceStub(successResponse)\n      const client = new RestClient(stubHttp as unknown as ConstructorParameters<"+"typeof RestClient>[0])\n      ;(client as unknown as { policy: unknown }).policy = stubPolicy\n\n      // Caller-provided config object MUST remain unchanged after the call —\n      // the decorator must spread into a fresh object instead of mutating.\n      const callerConfig: Record<"+"string, unknown> = { url: '/raw' }\n      await client.request(callerConfig as Parameters<"+"typeof client.request>[0])\n\n      expect(callerConfig).not.toHaveProperty('signal')\n      const passedConfig = stubHttp.request.mock.calls[0]![0] as Record<"+"string, unknown>\n      expect(passedConfig.signal).toBe(stubSignal)\n      expect(passedConfig).not.toBe(callerConfig)\n    })\n  })\n\n  describe('per-verb policy invocation (success path through real cockatiel pipeline)', () => {\n    // Drives every verb through the real CONSERVATIVE preset — guards against\n    // mutants that flip the verb wiring (e.g. swapping `get` for `delete`)\n    // because the underlying httpService stub records the exact verb that\n    // received the call.\n    const ALL_VERBS_LIST: Verb[] = [...ALL_VERBS]\n    it.each(ALL_VERBS_LIST)('%s success path returns the upstream AxiosResponse', async (verb) => {\n      const stubHttp = buildHttpServiceStub(successResponse)\n      const client = new RestClient(stubHttp as unknown as ConstructorParameters<"+"typeof RestClient>[0])\n\n      const result = await callVerb(client, verb)\n\n      expect(result).toBe(successResponse)\n      expect(stubHttp[verb]).toHaveBeenCalledTimes(1)\n      // No other verb should have been invoked on the httpService — guards\n      // against verb-mis-routing mutations.\n      for (const other of ALL_VERBS_LIST) {\n        if (other === verb) continue\n        expect(stubHttp[other]).not.toHaveBeenCalled()\n      }\n    })\n  })\n\n  describe('constructor', () => {\n    it('explicit `config = resiliencePolicyPresets.CONSERVATIVE` produces same policy shape as the default', () => {\n      const stubHttp = buildHttpServiceStub(successResponse)\n\n      const defaulted = new RestClient(stubHttp as unknown as ConstructorParameters<"+"typeof RestClient>[0])\n      const explicit = new RestClient(\n        stubHttp as unknown as ConstructorParameters<"+"typeof RestClient>[0],\n        resiliencePolicyPresets[ResilencePresets.CONSERVATIVE],\n      )\n\n      const defaultedWrapped = (defaulted.policy as unknown as { wrapped: object[] }).wrapped\n      const explicitWrapped = (explicit.policy as unknown as { wrapped: object[] }).wrapped\n      expect(defaultedWrapped).toHaveLength(explicitWrapped.length)\n      expect(defaultedWrapped.map((p) => p.constructor.name)).toEqual(\n        explicitWrapped.map((p) => p.constructor.name),\n      )\n    })\n\n    it('exposes the underlying axios instance via `axiosRef`', () => {\n      const stubHttp = buildHttpServiceStub(successResponse)\n      const client = new RestClient(stubHttp as unknown as ConstructorParameters<"+"typeof RestClient>[0])\n\n      expect(client.axiosRef).toBe(stubHttp.axiosRef)\n    })\n  })\n})\n"},"src/auth/__tests__/auth-rest.client.spec.ts":{"tests":[{"id":"41","name":"AuthRestClient constructor and field visibility exposes authStrategy as a public-readable field","location":{"start":{"column":6,"line":113}}},{"id":"42","name":"AuthRestClient verb forwarding forwards request to the underlying RestClient exactly once","location":{"start":{"column":24,"line":123}}},{"id":"43","name":"AuthRestClient verb forwarding forwards get to the underlying RestClient exactly once","location":{"start":{"column":24,"line":123}}},{"id":"44","name":"AuthRestClient verb forwarding forwards delete to the underlying RestClient exactly once","location":{"start":{"column":24,"line":123}}},{"id":"45","name":"AuthRestClient verb forwarding forwards head to the underlying RestClient exactly once","location":{"start":{"column":24,"line":123}}},{"id":"46","name":"AuthRestClient verb forwarding forwards post to the underlying RestClient exactly once","location":{"start":{"column":24,"line":123}}},{"id":"47","name":"AuthRestClient verb forwarding forwards put to the underlying RestClient exactly once","location":{"start":{"column":24,"line":123}}},{"id":"48","name":"AuthRestClient verb forwarding forwards patch to the underlying RestClient exactly once","location":{"start":{"column":24,"line":123}}},{"id":"49","name":"AuthRestClient verb forwarding forwards postForm to the underlying RestClient exactly once","location":{"start":{"column":24,"line":123}}},{"id":"50","name":"AuthRestClient verb forwarding forwards putForm to the underlying RestClient exactly once","location":{"start":{"column":24,"line":123}}},{"id":"51","name":"AuthRestClient verb forwarding forwards patchForm to the underlying RestClient exactly once","location":{"start":{"column":24,"line":123}}},{"id":"52","name":"AuthRestClient verb forwarding @Authenticate decorates req t":{"column":49,"line":296}}},{"id":"82","name":"AuthRestClient per-verb argument forwarding with explicit config head defaults the omitted config to {} and still merges Authorization","location":{"start":{"column":49,"line":296}}},{"id":"83","name":"AuthRestClient per-verb argument forwarding with explicit config request forwards (config) to the underlying RestClient","location":{"start":{"column":6,"line":312}}},{"id":"84","name":"AuthRestClient per-verb 401 retry semantics get recovers from a single 401 by retrying once and clearing auth","location":{"start":{"column":30,"line":336}}},{"id":"85","name":"AuthRestClient per-verb 401 retry semantics delete recovers from a single 401 by retrying once and clearing auth","location":{"start":{"column":30,"line":336}}},{"id":"86","name":"AuthRestClient per-verb 401 retry semantics head recovers from a single 401 by retrying once and clearing auth","location":{"start":{"column":30,"line":336}}},{"id":"87","name":"AuthRestClient per-verb 401 retry semantics post recovers from a single 401 by retrying once and clearing auth","location":{"start":{"column":30,"line":351}}},{"id":"88","name":"AuthRestClient per-verb 401 retry semantics put recovers from a single 401 by retrying once and clearing auth","location":{"start":{"column":30,"line":351}}},{"id":"89","name":"AuthRestClient per-verb 401 retry semantics patch recovers from a single 401 by retrying once and clearing auth","location":{"start":{"column":30,"line":351}}},{"id":"90","name":"AuthRestClient per-verb 401 retry semantics postForm recovers from a single 401 by retrying once and clearing auth","location":{"start":{"column":30,"line":351}}},{"id":"91","name":"AuthRestClient per-verb 401 retry semantics putForm recovers from a single 401 by retrying once and clearing auth","location":{"start":{"column":30,"line":351}}},{"id":"92","name":"AuthRestClient per-verb 401 retry semantics patchForm recovers from a single 401 by retrying once and clearing auth","location":{"start":{"column":30,"line":351}}},{"id":"93","name":"AuthRestClient per-verb 401 retry semantics request recovers from a single 401 by retrying once","location":{"start":{"column":6,"line":366}}}],"source":"import type { AxiosRequestConfig, AxiosResponse } from 'axios'\n\nimport type { RestClient } from '../../client/rest.client'\nimport type { AuthStrategyService } from '../auth-strategy.service'\nimport { AuthRestClient } from '../auth-rest.client'\n\n/**\n * Verb method names exposed by both {@link RestClient} and {@link AuthRestClient}.\n * Used to drive table-style tests so that a missing `@Authenticate()` on any\n * individual verb surfaces as a per-verb assertion failure rather than a\n * silent gap in coverage.\n */\nconst ALL_VERBS = [\n  'request',\n  'get',\n  'delete',\n  'head',\n  'post',\n  'put',\n  'patch',\n  'postForm',\n  'putForm',\n  'patchForm',\n] as const\ntype Verb = typeof ALL_VERBS[number]\n\n/** Verbs whose config argument lives at args[1] — `(url, config?)` shape. */\nconst INDEX_1_VERBS: ReadonlySet<"+"Verb> = new Set([\n  'get',\n  'delete',\n  'head',\n])\n\n/**\n * Builds an axios-like error object that satisfies `isAxiosError(err)`.\n *\n * `axios.isAxiosError` checks the truthy `isAxiosError` flag on the error\n * value, so any plain `Error` augmented with that flag and a `response`\n * member behaves identically to a real `AxiosError` for the decorator's\n * 401 / non-401 branching logic.\n */\nfunction makeAxiosError(status: number): Error {\n  const error = new Error(`Request failed with status code ${status}`) as Error & {\n    isAxiosError: boolean\n    response: { status: number }\n  }\n  error.isAxiosError = true\n  error.response = { status }\n  return error\n}\n\n/** Per-verb jest.fn map covering every method on {@link RestClient}. */\ntype RestClientStub = {\n  [K in Verb]: jest.Mock<"+"Promise<"+"AxiosResponse>, unknown[]>\n}\n\n/** Builds a fresh {@link RestClient} stub where every verb resolves to the same response. */\nfunction createRestClientStub(response: AxiosResponse = { data: 'ok' } as AxiosResponse): RestClientStub {\n  const stub = {} as RestClientStub\n  for (const verb of ALL_VERBS) {\n    stub[verb] = jest.fn().mockResolvedValue(response)\n  }\n  return stub\n}\n\n/** Lightweight typed stub for the auth strategy surface read by `@Authenticate`. */\ninterface AuthStrategyStub {\n  authenticateIfNeeded: jest.Mock<"+"Promise<"+"void>, []>\n  extendRequest: jest.Mock<"+"AxiosRequestConfig, [AxiosRequestConfig]>\n  clearAuth: jest.Mock<"+"void, []>\n}\n\n/**\n * Builds a fresh strategy stub whose {@link AuthStrategyStub.extendRequest}\n * merges an `Authorization: Bearer X` header into any incoming config.\n */\nfunction createAuthStrategyStub(): AuthStrategyStub {\n  return {\n    authenticateIfNeeded: jest.fn().mockResolvedValue(undefined),\n    extendRequest: jest.fn(\n      (config: AxiosRequestConfig): AxiosRequestConfig => ({\n        ...config,\n        headers: {\n          ...((config.headers as Record<"+"string, unknown> | undefined) ?? {}),\n          Authorization: 'Bearer X',\n        },\n      }),\n    ),\n    clearAuth: jest.fn(),\n  }\n}\n\n/**\n * Constructs an {@link AuthRestClient} bound to fresh stubs and returns the\n * client together with handles to those stubs for assertions.\n */\nfunction buildSut(): {\n  client: AuthRestClient\n  restClient: RestClientStub\n  authStrategy: AuthStrategyStub\n} {\n  const restClient = createRestClientStub()\n  const authStrategy = createAuthStrategyStub()\n  const client = new AuthRestClient(\n    restClient as unknown as RestClient,\n    authStrategy as unknown as AuthStrategyService,\n  )\n  return { client, restClient, authStrategy }\n}\n\ndescribe('AuthRestClient', () => {\n  describe('constructor and field visibility', () => {\n    it('exposes authStrategy as a public-readable field', () => {\n      const { client, authStrategy } = buildSut()\n\n      // The `@Authenticate` decorator reads `context.target.authStrategy` at\n      // call time, so the field MUST be public-readable on the instance.\n      expect(client.authStrategy).toBe(authStrategy)\n    })\n  })\n\n  describe('verb forwarding', () => {\n    it.each(ALL_VERBS)('forwards %s to the underlying RestClient exactly once', async (verb) => {\n      const { client, restClient } = buildSut()\n\n      // Each verb is invoked with a config argument at the appropriate index\n      // so that `@Authenticate`'s config-arg lookup succeeds. Verbs at\n      // index 1 use `(url, config)`; verbs at index 2 use `(url, data, config)`;\n      // `request` uses `(config)` and is index-1 per the decorator.\n      if (verb === 'request') {\n        await (client[verb] as (config: AxiosRequestConfig) => Promise<"+"AxiosResponse>)({ url: '/r' })\n      }\n      else if (INDEX_1_VERBS.has(verb)) {\n        await (client[verb] as (url: string, config?: AxiosRequestConfig) => Promise<"+"AxiosResponse>)('/x')\n      }\n      else {\n        await (\n          client[verb] as (url: string, data: unknown, config?: AxiosRequestConfig) => Promise<"+"AxiosResponse>\n        )('/x', { payload: 1 })\n      }\n\n      expect(restClient[verb]).toHaveBeenCalledTimes(1)\n      // No other verb method on the underlying RestClient should have fired.\n      for (const other of ALL_VERBS) {\n        if (other === verb) continue\n        expect(restClient[other]).not.toHaveBeenCalled()\n      }\n    })\n\n    it.each(ALL_VERBS)('@Authenticate decorates %s — pre-flight authenticateIfNeeded runs before forwarding', async (verb) => {\n      const { client, restClient, authStrategy } = buildSut()\n\n      const callOrder: string[] = []\n      authStrategy.authenticateIfNeeded.mockImplementation(async () => {\n        callOrder.push('authenticateIfNeeded')\n      })\n      restClient[verb].mockImplementation(async () => {\n        callOrder.push('forward')\n        return { data: 'ok' } as AxiosResponse\n      })\n\n      if (verb === 'request') {\n        await (client[verb] as (config: AxiosRequestConfig) => Promise<"+"AxiosResponse>)({ url: '/r' })\n      }\n      else if (INDEX_1_VERBS.has(verb)) {\n        await (client[verb] as (url: string, config?: AxiosRequestConfig) => Promise<"+"AxiosResponse>)('/x')\n      }\n      else {\n        await (\n          client[verb] as (url: string, data: unknown, config?: AxiosRequestConfig) => Promise<"+"AxiosResponse>\n        )('/x', { payload: 1 })\n      }\n\n      // Decoration is verified by observing the pre-flight authenticateIfNeeded\n      // hook firing strictly before the underlying RestClient call.\n      expect(authStrategy.authenticateIfNeeded).toHaveBeenCalledTimes(1)\n      expect(callOrder).toEqual(['authenticateIfNeeded', 'forward'])\n    })\n  })\n\n  describe('header merge after extendRequest', () => {\n    it('merges Authorization: Bearer X with original headers on get(/x, { headers: { y: \\'z\\' } })', async () => {\n      const { client, restClient, authStrategy } = buildSut()\n\n      await client.get('/x', { headers: { y: 'z' } })\n\n      // The decorator passes the original config through extendRequest…\n      expect(authStrategy.extendRequest).toHaveBeenCalledTimes(1)\n      expect(authStrategy.extendRequest).toHaveBeenCalledWith({ headers: { y: 'z' } })\n\n      // …and the underlying RestClient receives the merged result, with both\n      // the original `y: 'z'` header and the strategy's Authorization header.\n      expect(restClient.get).toHaveBeenCalledTimes(1)\n      expect(restClient.get).toHaveBeenCalledWith('/x', {\n        headers: { y: 'z', Authorization: 'Bearer X' },\n      })\n    })\n  })\n\n  describe('401 first, success second', () => {\n    it('triggers exactly two underlying RestClient calls and invokes authenticateIfNeeded twice', async () => {\n      const { client, restClient, authStrategy } = buildSut()\n\n      // First call rejects with a 401; second call resolves successfully.\n      // The `@Authenticate` decorator's contract is: catch 401, clearAuth,\n      // re-authenticate, and retry the underlying method exactly once.\n      restClient.get\n        .mockRejectedValueOnce(makeAxiosError(401))\n        .mockResolvedValueOnce({ data: 'ok' } as AxiosResponse)\n\n      const response = await client.get('/x')\n\n      expect(response.data).toBe('ok')\n      expect(restClient.get).toHaveBeenCalledTimes(2)\n      expect(authStrategy.authenticateIfNeeded).toHaveBeenCalledTimes(2)\n      expect(authStrategy.clearAuth).toHaveBeenCalledTimes(1)\n    })\n  })\n\n  describe('500 error path', () => {\n    it('rethrows the 500 and invokes authenticateIfNeeded exactly once (pre-flight only)', async () => {\n      const { client, restClient, authStrategy } = buildSut()\n\n      // 500 is non-401, so the decorator must NOT retry and must NOT clearAuth.\n      restClient.get.mockRejectedValueOnce(makeAxiosError(500))\n\n      await expect(client.get('/x')).rejects.toMatchObject({\n        isAxiosError: true,\n        response: { status: 500 },\n      })\n\n      expect(restClient.get).toHaveBeenCalledTimes(1)\n      expect(authStrategy.authenticateIfNeeded).toHaveBeenCalledTimes(1)\n      expect(authStrategy.clearAuth).not.toHaveBeenCalled()\n    })\n  })\n\n  describe('per-verb argument forwarding with explicit config', () => {\n    // Each verb is exercised with both shapes of its public surface — with\n    // and without the optional `config` argument — so the optional-arg\n    // branches in the verb wrappers' transpiled output are exercised.\n\n    it.each(['get', 'delete', 'head'] as const)(\n      '%s forwards (url, config) to the underlying RestClient with merged Authorization header',\n      async (verb) => {\n        const { client, restClient, authStrategy } = buildSut()\n\n        const config: AxiosRequestConfig = { headers: { 'x-trace': 't' } }\n        await client[verb]('/path', config)\n\n        expect(restClient[verb]).toHaveBeenCalledTimes(1)\n        expect(restClient[verb]).toHaveBeenCalledWith('/path', {\n          headers: { 'x-trace': 't', Authorization: 'Bearer X' },\n        })\n        // The strategy must observe the original (un-augmented) config so that\n        // re-authentication after a 401 starts from the caller-supplied state.\n        expect(authStrategy.extendRequest).toHaveBeenCalledWith({ headers: { 'x-trace': 't' } })\n      },\n    )\n\n    it.each(['post', 'put', 'patch', 'postForm', 'putForm', 'patchForm'] as const)(\n      '%s forwards (url, data, config) to the underlying RestClient with merged Authorization header',\n      async (verb) => {\n        const { client, restClient, authStrategy } = buildSut()\n\n        const data = { id: 42 }\n        const config: AxiosRequestConfig = { headers: { 'x-trace': 't' } }\n        await client[verb]('/path', data, config)\n\n        expect(restClient[verb]).toHaveBeenCalledTimes(1)\n        expect(restClient[verb]).toHaveBeenCalledWith('/path', data, {\n          headers: { 'x-trace': 't', Authorization: 'Bearer X' },\n        })\n        expect(authStrategy.extendRequest).toHaveBeenCalledWith({ headers: { 'x-trace': 't' } })\n      },\n    )\n\n    it.each(['post', 'put', 'patch', 'postForm', 'putForm', 'patchForm'] as const)(\n      '%s defaults the omitted config to {} and still merges Authorization',\n      async (verb) => {\n        const { client, restClient, authStrategy } = buildSut()\n\n        // Omitting the `config` arg forces the decorator's `args[idx] ?? {}`\n        // fallback to fire — covers the optional-config branch on data verbs.\n        await (\n          client[verb] as (url: string, data: unknown) => Promise<"+"AxiosResponse>\n        )('/path', { id: 1 })\n\n        expect(authStrategy.extendRequest).toHaveBeenCalledWith({})\n        expect(restClient[verb]).toHaveBeenCalledWith('/path', { id: 1 }, {\n          headers: { Authorization: 'Bearer X' },\n        })\n      },\n    )\n\n    it.each(['get', 'delete', 'head'] as const)(\n      '%s defaults the omitted config to {} and still merges Authorization',\n      async (verb) => {\n        const { client, restClient, authStrategy } = buildSut()\n\n        // Omit `config` for the (url, config?) verbs — exercises the optional\n        // arg branch on the index-1 verb shape.\n        await client[verb]('/path')\n\n        expect(authStrategy.extendRequest).toHaveBeenCalledWith({})\n        expect(restClient[verb]).toHaveBeenCalledWith('/path', {\n          headers: { Authorization: 'Bearer X' },\n        })\n      },\n    )\n\n    it('request forwards (config) to the underlying RestClient', async () => {\n      const { client, restClient, authStrategy } = buildSut()\n\n      await client.request({ url: '/raw', method: 'GET' })\n\n      expect(restClient.request).toHaveBeenCalledTimes(1)\n      // The `request` verb's config sits at args[0] on the public surface but\n      // the decorator's `configArgIndex('request') === 1` writes the extended\n      // config into args[1]. The forwarded args[0] is the caller's original\n      // config object, untouched.\n      expect(restClient.request.mock.calls[0]![0]).toEqual({ url: '/raw', method: 'GET' })\n      // Pre-flight authenticate ran exactly once.\n      expect(authStrategy.authenticateIfNeeded).toHaveBeenCalledTimes(1)\n    })\n  })\n\n  describe('per-verb 401 retry semantics', () => {\n    // Mutation testing flips the 401 status check across every verb. Running\n    // the 401 retry path through every verb makes those mutants observable.\n    type IndexOneVerb = 'get' | 'delete' | 'head'\n    type IndexTwoVerb = 'post' | 'put' | 'patch' | 'postForm' | 'putForm' | 'patchForm'\n    const INDEX_ONE_VERBS: IndexOneVerb[] = ['get', 'delete', 'head']\n    const INDEX_TWO_VERBS: IndexTwoVerb[] = ['post', 'put', 'patch', 'postForm', 'putForm', 'patchForm']\n\n    it.each(INDEX_ONE_VERBS)(\n      '%s recovers from a single 401 by retrying once and clearing auth',\n      async (verb) => {\n        const { client, restClient, authStrategy } = buildSut()\n        restClient[verb]\n          .mockRejectedValueOnce(makeAxiosError(401))\n          .mockResolvedValueOnce({ data: 'recovered' } as AxiosResponse)\n\n        const response = await client[verb]('/x')\n        expect(response.data).toBe('recovered')\n        expect(restClient[verb]).toHaveBeenCalledTimes(2)\n        expect(authStrategy.clearAuth).toHaveBeenCalledTimes(1)\n      },\n    )\n\n    it.each(INDEX_TWO_VERBS)(\n      '%s recovers from a single 401 by retrying once and clearing auth',\n      async (verb) => {\n        const { client, restClient, authStrategy } = buildSut()\n        restClient[verb]\n          .mockRejectedValueOnce(makeAxiosError(401))\n          .mockResolvedValueOnce({ data: 'recovered' } as AxiosResponse)\n\n        const response = await client[verb]('/x', { id: 1 })\n        expect(response.data).toBe('recovered')\n        expect(restClient[verb]).toHaveBeenCalledTimes(2)\n        expect(authStrategy.clearAuth).toHaveBeenCalledTimes(1)\n      },\n    )\n\n    it('request recovers from a single 401 by retrying once', async () => {\n      const { client, restClient, authStrategy } = buildSut()\n      restClient.request\n        .mockRejectedValueOnce(makeAxiosError(401))\n        .mockResolvedValueOnce({ data: 'recovered' } as AxiosResponse)\n\n      const response = await client.request({ url: '/raw' })\n      expect(response.data).toBe('recovered')\n      expect(restClient.request).toHaveBeenCalledTimes(2)\n      expect(authStrategy.clearAuth).toHaveBeenCalledTimes(1)\n    })\n  })\n})\n"},"src/client/__tests__/resilience-policy-builder.spec.ts":{"tests":[{"id":"94","name":"resiliencePolicyBuilder empty / single-policy branches returns NoopPolicy when config is empty","location":{"start":{"column":6,"line":48}}},{"id":"95","name":"resiliencePolicyBuilder empty / single-policy branches wraps a single RetryPolicy when only retry is configured","location":{"start":{"column":6,"line":54}}},
